<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe4ec, #fff7f9);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #3b2029;
  }
  .card {
    width: min(92%, 430px);
    min-height: 480px;
    background: rgba(255,255,255,.9);
    border-radius: 28px;
    padding: 38px 26px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(120, 30, 60, .16);
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .heart { font-size: 58px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  h1 { margin: 16px 0 10px; font-size: 30px; }
  p { color: #765560; line-height: 1.6; }
  .buttons {
    height: 120px;
    position: relative;
    margin-top: 20px;
  }
  button {
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }
  #yes {
    background: #ff4f7b;
    color: white;
    box-shadow: 0 8px 20px rgba(255,79,123,.28);
  }
  #yes:hover { transform: translateY(-2px) scale(1.03); }
  #no {
    position: absolute;
    background: #eee;
    color: #555;
    left: 55%;
    top: 15px;
  }
  .hidden { display: none !important; }
  .field {
    width: 100%;
    padding: 13px 15px;
    margin: 8px 0;
    border: 1px solid #f0cbd5;
    border-radius: 14px;
    font-size: 15px;
    outline: none;
  }
  .field:focus { border-color: #ff7093; }
  .submit {
    width: 100%;
    margin-top: 12px;
    background: #ff4f7b;
    color: white;
  }
  .summary {
    background: #fff1f5;
    border-radius: 18px;
    padding: 15px;
    margin-top: 14px;
    line-height: 1.8;
  }
  .small { font-size: 13px; opacity: .7; }
  .confetti {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
    z-index: 10;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="question">
  <div class="heart">❤️</div>
  <h1 id="title">I have a little question...</h1>
  <p id="message">Would you go on a date with me?</p>

  <div class="buttons" id="buttonArea">
    <button id="yes">YES ❤️</button>
    <button id="no">NO 🙈</button>
  </div>
  <div class="small">Choose wisely 😌</div>
</div>

<div class="card hidden" id="details">
  <div class="heart">🥰</div>
  <h1>It's a date!</h1>
  <p>Okay, now let's figure out the details ❤️</p>

  <input class="field" id="date" type="date">
  <input class="field" id="time" type="time">
  <input class="field" id="place" type="text" placeholder="Where should we go?">

  <button class="submit" id="confirm">Confirm our date 💕</button>
</div>

<div class="card hidden" id="final">
  <div class="heart">💖</div>
  <h1>See you on the date!</h1>
  <p>I'm officially looking forward to it.</p>
  <div class="summary" id="summary"></div>
  <p class="small">Screenshot this if you want proof that you said YES 😌</p>
</div>

<script>
  // ===== CUSTOMIZE THESE =====
  const herName = ""; // Example: "Sarah"
  // ============================

  if (herName.trim()) {
    document.getElementById("title").textContent = `Hey ${herName} ❤️`;
  }

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const area = document.getElementById("buttonArea");

  function moveNo() {
    const maxX = Math.max(0, area.clientWidth - no.offsetWidth);
    const maxY = Math.max(0, area.clientHeight - no.offsetHeight);
    no.style.left = Math.random() * maxX + "px";
    no.style.top = Math.random() * maxY + "px";
  }

  no.addEventListener("mouseenter", moveNo);
  no.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNo();
  });
  no.addEventListener("click", moveNo);

  yes.addEventListener("click", () => {
    document.getElementById("question").classList.add("hidden");
    document.getElementById("details").classList.remove("hidden");
    launchConfetti();
  });

  document.getElementById("confirm").addEventListener("click", () => {
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const place = document.getElementById("place").value.trim();

    const dateText = date
      ? new Date(date + "T00:00:00").toLocaleDateString(undefined, {
          weekday: "long", year: "numeric", month: "long", day: "numeric"
        })
      : "Whenever we decide ❤️";

    const timeText = time || "We'll decide together";
    const placeText = place || "Somewhere nice";

    document.getElementById("summary").innerHTML =
      `<strong>📅 ${dateText}</strong><br>
       🕐 ${timeText}<br>
       📍 ${placeText}`;

    document.getElementById("details").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
    launchConfetti();
  });

  function launchConfetti() {
    const emojis = ["❤️","💕","💖","✨","🌸"];
    for (let i = 0; i < 35; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = (2 + Math.random() * 3) + "s";
      el.style.animationDelay = Math.random() * .5 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5500);
    }
  }
</script>
</body>
</html>
